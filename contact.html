  <style>
    body {
      background: radial-gradient(circle at center, #0e172a 0%, #070b14 100%);
      min-height: 100vh;
      overflow-x: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Main Orbit Stage */
    .orbit-wrapper {
      position: relative;
      width: 560px;
      height: 560px;
      margin: auto;
    }

    /* Outer Dashed Ring & Rotating Container */
    .orbit-ring-outer {
      position: absolute;
      inset: 0;
      border: 2px dashed rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      animation: spinClockwise 40s linear infinite;
    }

    /* Inner Dashed Ring & Counter-Rotating Container */
    .orbit-ring-inner {
      position: absolute;
      inset: 105px;
      border: 2px dashed rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      animation: spinCounterClockwise 28s linear infinite;
    }

    /* Pause ring motion when hovering over an icon */
    .orbit-ring-outer:hover,
    .orbit-ring-inner:hover {
      animation-play-state: paused;
    }

    .orbit-ring-outer:hover .tech-badge,
    .orbit-ring-inner:hover .tech-badge {
      animation-play-state: paused;
    }

    /* Center Profile Photo with Entrance & Gentle Float */
    .profile-container {
      position: absolute;
      bottom: 35px;
      left: 50%;
      width: 280px;
      height: 390px;
      z-index: -5;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      pointer-events: none;
      -webkit-mask-image: radial-gradient(ellipse 90% 95% at 50% 45%, black 75%, transparent 100%);
      mask-image: radial-gradient(ellipse 90% 95% at 50% 45%, black 75%, transparent 100%);
      animation: profileEntrance 1s , subtleFloat 5s ease-in-out 1s infinite;
    }

    .profile-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-top-left-radius: 50%;
      border-top-right-radius: 50%;
    }

    /* Tech Icon Badges */
    .tech-badge {
      position: absolute;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    /* Counter-rotate badges so icons stay upright while orbiting */
    .orbit-ring-outer .tech-badge {
      animation: counterSpinClockwise 40s linear infinite;
    }

    .orbit-ring-inner .tech-badge {
      animation: counterSpinCounterClockwise 28s linear infinite;
    }

    .badge-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .tech-badge:hover .badge-inner {
      transform: scale(1.15);
    }

    .tech-badge:hover .tech-label {
      color: #ffffff;
    }

    .icon-box {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .icon-box-sm {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      font-size: 30px;
    }

    /* Circular variant for badges */
    .icon-box-circle {
      border-radius: 50%;
    }

    .tech-label {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.3px;
      transition: color 0.3s ease;
    }

    /* Custom Badge Themes */
    .bg-dark-tile {
      background: linear-gradient(145deg, #2b2f36, #1c1f24);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .bg-light-tile {
      background: linear-gradient(145deg, #ffffff, #e6e9ef);
    }

    .bg-express {
      background: #2d2d2d;
      border-radius: 50%;
      color: #ffffff;
      font-size: 28px;
      font-weight: 400;
    }

    .bg-node {
      background: #8cc84b;
      clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
      border-radius: 0;
      color: #212529;
      font-size: 17px;
      font-weight: 800;
    }

    /* Positions on Outer Ring (560x560) */
    .pos-mongodb  { top: 13%; left: 16%; }
    .pos-vue      { top: 8%;  left: 72%; } /* Replaced outer React with Vue or another tech if needed */
    .pos-node     { top: 61%; left: 94%; }
    .pos-tailwind { top: 98%; left: 52%; }
    .pos-express  { top: 64%; left: 5%;  }

    /* Positions relative to Inner Ring (350x350) */
    .pos-html5    { top: 9%;  left: 15%; }
    .pos-react-in { top: 9%;  left: 78%; } /* React inside a circle on inner ring */
    .pos-css3     { top: 78%; left: 85%; }

    /* Keyframe Animations */
    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes counterSpinClockwise {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(-360deg); }
    }

    @keyframes spinCounterClockwise {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-360deg); }
    }

    @keyframes counterSpinCounterClockwise {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes profileEntrance {
      from {
        opacity: 0;
        transform: translate(-50%, 25px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
    }

    @keyframes subtleFloat {
      0%, 100% { transform: translate(-50%, 0px); }
      50%      { transform: translate(-50%, -6px); }
    }

    /* Responsive Scaling for Mobile Screens */
    @media (max-width: 620px) {
      .orbit-wrapper {
        transform: scale(0.62);
        transform-origin: top center;
        margin-bottom: -180px;
      }
    }
  </style>
